<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBC 시뮬레이터</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --line:#2c313b; --text:#e6e8ec; --dim:#8a92a3; --on:#ffd34d; --bad:#ff5c5c; --ok:#5cd68a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Noto Sans KR", sans-serif; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px; max-width:1100px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { margin:0 0 8px; font-size:13px; color:var(--dim); font-weight:600; }
  table { border-collapse:collapse; width:100%; }
  td { padding:3px 6px; border-bottom:1px solid var(--line); }
  td:first-child { color:var(--dim); width:45%; }
  .on { color:var(--on); font-weight:700; } .bad { color:var(--bad); font-weight:700; } .ok { color:var(--ok); }
  #log { height:260px; overflow:auto; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
  #help { grid-column: 1 / -1; color:var(--dim); font-size:13px; }
  kbd { background:#2a2f39; border-radius:3px; padding:0 4px; color:var(--text); }
  #err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <section><h2>입력 (지금 보내는 값)</h2><table id="in"></table></section>
  <section><h2>출력 · 판정 (C 코어 결과)</h2><table id="out"></table></section>
  <section style="grid-column:1/-1"><h2>이벤트 로그 <span id="err"></span></h2><div id="log"></div></section>
  <section id="help">
    <kbd>↑</kbd> 가속 · <kbd>Shift</kbd> 풀 가속 · <kbd>↓</kbd> 브레이크 ·
    <kbd>I</kbd> 시동 · <kbd>P</kbd><kbd>R</kbd><kbd>N</kbd><kbd>D</kbd> 기어 ·
    <kbd>L</kbd> 조명 스위치 · <kbd>W</kbd> 와이퍼 스위치 · <kbd>1</kbd>~<kbd>4</kbd> 도어 FL FR RL RR ·
    <kbd>Space</kbd> 일시정지 · <kbd>.</kbd> 한 틱 · <kbd>[</kbd> <kbd>]</kbd> 배속 ·
    아래 칸에 콘솔 명령 입력 (예: <code>rain 70</code>, <code>lux 300</code>, <code>cut lux</code>)
    <form id="cmdform"><input id="cmd" placeholder="명령 입력 후 Enter" style="width:100%;margin-top:8px;padding:6px;background:#0f1115;color:var(--text);border:1px solid var(--line);border-radius:4px"></form>
  </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
